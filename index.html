        /* CONFIGURACIÓN DE COLORES EN TONOS AZULES */
        :root {
            --primary-blue: #0f2d59; /* Azul oscuro elegante (Títulos) */
            --accent-blue: #2563eb; /* Azul brillante (Fechas y Barras) */
            --text-dark: #334155; /* Gris Oscuro para el texto principal */
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f1f5f9;
            color: var(--text-dark);
            margin: 0;
            padding: 20px;
        }
        .cv-container {
            max-width: 800px;
            background: #ffffff;
            margin: 0 auto;
            padding: 30px;
            box-shadow: 0 4px 12px rgba(14, 45, 89, 0.08);
            border-radius: 6px;
        }
        /* Mariana Reyes Lobato */
        header{
            display: flex;
            justify-content: space-between;
            border-bottom: 3px solid var(--primary-blue);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        header h1 { margin: 0; color: var(--primary-blue); font-size: 30px; }
        header p { margin: 5px 0 0 0; font-size: 14px; color: var(--text-dark); }

        /* REPARTO EN DOS COLUMNAS */
        .cv-body {
            display: grid;
            grid-template-columns: 1.2fr 1fr; /* Columna izquierda un poco más ancha */
            gap: 30px;
        }
        h2 {
            color: var(--primary-blue);
            font-size: 16px;
            text-transform: uppercase;
            border-bottom: 2px solid #cbd5e1;
            padding-bottom: 4px;
            margin-top: 0;
            margin-bottom: 12px;
        }
        section {margin-bottom: 25px; }
        p { margin: 0 0 8px 0; font-size: 14px; }
        b { color: #0f172a; }
        ul { margin: 0; padding-left: 20px; font-size: 14px; }
        li { margin-bottom: 4px; }
    </style>
</head>
